<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloudflare Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">
    <nav class="bg-white border-b sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600">MyBlog CMS</a>
            <a href="/admin.html" class="text-sm bg-gray-900 text-white px-4 py-2 rounded-lg hover:bg-gray-700">WP
                Admin</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <div id="post-list" class="space-y-6"></div>
        <article id="single-post" class="hidden bg-white p-8 rounded-xl shadow-sm border">
            <button onclick="showList()"
                class="text-blue-600 text-sm font-medium mb-6 inline-block hover:underline">&larr; Back to all
                posts</button>
            <h1 id="post-title" class="text-3xl font-bold mb-2"></h1>
            <p id="post-date" class="text-sm text-gray-400 mb-6"></p>
            <div id="post-content" class="prose max-w-none leading-relaxed space-y-4"></div>
        </article>
    </main>

    <script>
        async function loadPosts() {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            const container = document.getElementById('post-list');

            if (!posts.length) {
                container.innerHTML = `<p class="text-gray-500 text-center py-10">No posts published yet. Go to Admin to create one!</p>`;
                return;
            }

            container.innerHTML = posts.map(p => `
                <div class="bg-white p-6 rounded-xl shadow-sm border hover:border-blue-300 transition cursor-pointer" onclick="openPost('${p.slug}')">
                    <h2 class="text-xl font-bold text-gray-900 mb-2">${p.title}</h2>
                    <p class="text-gray-600 mb-3">${p.excerpt || p.content.replace(/<[^>]*>/g, '').slice(0, 140) + '...'}</p>
                    <span class="text-xs text-gray-400">${new Date(p.created_at).toLocaleDateString()}</span>
                </div>
            `).join('');
        }

        async function openPost(slug) {
            const res = await fetch(`/api/posts/${slug}`);
            const post = await res.json();
            document.getElementById('post-list').classList.add('hidden');
            document.getElementById('single-post').classList.remove('hidden');
            document.getElementById('post-title').textContent = post.title;
            document.getElementById('post-date').textContent = new Date(post.created_at).toLocaleDateString();
            document.getElementById('post-content').innerHTML = post.content;
            window.history.pushState({}, '', `?post=${slug}`);
        }

        function showList() {
            document.getElementById('single-post').classList.add('hidden');
            document.getElementById('post-list').classList.remove('hidden');
            window.history.pushState({}, '', '/');
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get('post')) {
            openPost(params.get('post'));
        } else {
            loadPosts();
        }
    </script>
</body>

</html>
